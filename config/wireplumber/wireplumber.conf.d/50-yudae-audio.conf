monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-snd_aloop.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.platform-snd_aloop.*" }
      { node.name = "~alsa_input.platform-snd_aloop.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

node.rules = [
  {
    matches = [
      { node.name = "yudae-vm" }
      { node.name = "yudae-audio" }
    ]
    actions = {
      update-props = {
        node.hidden = true
      }
    }
  }
]
