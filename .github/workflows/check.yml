name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      XMAKE_ROOT: y
    steps:
      - uses: actions/checkout@v7
      - run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"
      - run: pacman -Syu --noconfirm base-devel zig xmake git pkgconf libsystemd polkit glib2 qt6-base qt6-declarative qt6-wayland mesa wayland wayland-protocols pipewire libjpeg-turbo libwebp ffmpeg
      - run: xmake
      - run: xmake test daemon-tests -v
      - run: xmake test -v
