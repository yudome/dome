[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
ImageId=yudae-guest
Output=guest
CompressOutput=no
ElTorito=no
SectorSize=512
OutputSize=32G

[Content]
Bootable=no
Hostname=yudae-guest
Locale=C.UTF-8
WithDocs=no
RemoveFiles=/usr/share/man /usr/share/info /usr/share/gtk-doc

[Build]
ToolsTree=no
Incremental=yes
ForeignUIDRange=yes
WithNetwork=yes
