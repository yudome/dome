# Wallpaper picker
[wallpaper]
wallpaperTransition = "fade"  # none, fade or a transition plugin id
wallpaperTransitionMs = 400  # 0..2000
wallpaperVideoLoop = false  # loop video wallpapers instead of settling on the still frame
wallpaperPause = "fullscreen"  # fullscreen, any-window or never
wallpaperAudio = false  # play the sound of video wallpapers
wallpaperVolume = 0.6  # 0..1
wallpaperEmpty = "No wallpapers found"
wallpaperPickerWidth = 1100
wallpaperWatchMs = 300
wallpaperPreviewRatio = 1.78
wallpaperRowHeight = 230
wallpaperRowMin = 115
wallpaperSlimRatio = 0.42
wallpaperNameSize = 13
themeEmpty = "No themes installed"
themeNameSize = 24
wallpaperPickerPadding = 16
wallpaperRingWidth = 2
wallpaperMarkSize = 11
wallpaperFadeMs = 160
wallpaperScrim = 0.45
wallpaperScrimMs = 180
