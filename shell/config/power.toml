# Lock screen
[lock]
lockAfterMinutes = 10  # idle before the shell locks, 0 disables
lockSleepAfterMinutes = 30  # idle while locked before suspend, 0 disables
lockWallpaper = "desktop"  # desktop, or a path to an image or video
greeterWallpaper = "lock"  # lock, desktop, or a path to an image or video
lockIdleSeconds = 15  # no input this long hides all but the wallpaper, 0 never
lockClockFormat = "h:mm AP"  # Qt time format like clockFormat
lockDateFormat = "dddd, MMMM d"  # Qt date format
lockClockSize = 56
lockDateSize = 20
lockCardWidth = 420
lockFieldHeight = 40
lockCellSize = 72
lockMenuRowHeight = 56
lockMenuTextSize = 22
lockFadeMs = 450
lockCooldownMs = 3000
lockPamService = "quickshell"
lockWrongText = "Wrong password"
lockPamError = "Authentication unavailable"
lockUnlockHint = "↵ unlock"
lockCheckingText = "checking"

# Power
[power]
powerActions = [
	{ name = "Shut down", command = "systemctl poweroff", glyph = "\uF011" },
	{ name = "Reboot", command = "systemctl reboot", glyph = "\uEAD2" },
	{ name = "Suspend", command = "systemctl suspend", glyph = "\U000F04B2" },
	{ name = "Lock", command = "\"$HOME/dotfiles/daemon/zig-out/bin/yudaemond\" lock", glyph = "\uF023" },
	{ name = "Log out", command = "\"$HOME/dotfiles/daemon/zig-out/bin/yudaemond\" logout", glyph = "\uEA6E" }
]
powerCellSize = 96
powerIconSize = 48
powerHighlightSize = 80
powerLabelSize = 12
powerTooltipWidth = 240  # same as cpuTooltipWidth
powerDemo = false  # fake battery on a desktop, for testing the flow
powerFlowHeight = 40
powerGovernorTitle = "Governor"
powerAwakeOff = "Off"
powerAwakeAuto = "While working"
powerAwakeOn = "Always on"
