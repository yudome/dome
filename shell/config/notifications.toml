# Notifications
[notify]
notifyScale = 1.25  # 0.75..2
notifyWidth = 350  # Math.round(280 * notifyScale)
notifyPadding = 15  # Math.round(12 * notifyScale)
notifyPaddingY = 0
notifyRowHeight = 48  # Math.round(38 * notifyScale)
notifyRowPadding = 3  # Math.round(2 * notifyScale)
notifySlot = 33  # Math.round(26 * notifyScale)
notifySlotGap = 13  # Math.round(10 * notifyScale)
notifyBellSize = 30  # Math.round(24 * notifyScale)
notifyAppFontSize = 14  # Math.round(11 * notifyScale)
notifyVisibleRows = 5  # 1..12
notifyHistory = 50
notifyGoneOpacity = 0.55
notifyEmpty = "Nothing yet"  # hidden
notifyTimeout = 6000  # 1000..20000
notifyDismissKey = "d"  # hidden
notifyClearKey = "x"  # hidden

# Popups
[popup]
popupCloseDelay = 60  # 0..500
popupFadeMs = 140
popupSlideMs = 400
barFadeMs = 200
popupPos = "top-center"  # top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
popupX = -1
popupY = -1
popupBorderWidth = 1
panelPadding = 12  # 4..32
volumeOsdMs = 1500

# Tooltips
[tooltip]
tooltipOffsetX = 0
tooltipGap = 7
tooltipGapRight = 3
tooltipHang = 8
