# Type and spacing
[shell]
workspaceSpacing = 6  # 0..24
workspaceMorphMs = 320
figureLobes = 9
figureScallop = 0.16
fontFamily = "GoogleSansCode Nerd Font"
fontSize = 14  # 8..24
valueSample = "0123456789.%G"
iconSize = 13  # 6..24
spacing = 12  # 0..32
scrollbarWidth = 2
scrollbarHoverWidth = 6  # 2..12
scrollbarMinThumb = 12
scrollbarFadeMs = 200
scrollbarIdleMs = 900
gapsIn = 4  # 0..24
gapsOut = 8  # 0..32
hints = true  # key hints next to search fields, launcher rows and buttons

# Saving